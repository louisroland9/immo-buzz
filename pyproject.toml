[project]
name = "immo-buzz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "louis ROLAND", email = "louisroland9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "sqlmodel>=0.0.48",
    "streamlit>=1.65.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
immo-buzz = "immo_buzz:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
